<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro de Usuario</title>
  <style>
    body {
      background-color: #1e1e1e;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    form {
      background-color: #2d2d2d;
      padding: 30px;
      border-radius: 10px;
      width: 350px;
      box-shadow: 0 0 10px #000;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 5px;
    }
    input[type="text"], input[type="password"] {
      background-color: #444;
      color: #fff;
    }
    input[type="submit"] {
      margin-top: 15px;
      background-color: #007bff;
      color: white;
      cursor: pointer;
      transition: 0.3s;
    }
    input[type="submit"]:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
  <form action="/registro" method="POST">
    <h2>Registro de Usuario</h2>

    <label for="usuario">Usuario:</label>
    <input type="text" id="usuario" name="usuario" maxlength="35" required>

    <label for="clave">Clave:</label>
    <input type="password" id="clave" name="clave" maxlength="35" required>

    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" maxlength="85">

    <label for="direccion">Dirección:</label>
    <input type="text" id="direccion" name="direccion" maxlength="100">

    <label for="telefono">Teléfono:</label>
    <input type="text" id="telefono" name="telefono" maxlength="9">

    <input type="submit" value="Registrar">
  </form>
</body>
</html>
