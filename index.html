 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primer aplicacion web - python</title>
 </head>
 <body>
    Hola mundo desde python

    <input type="text" name="txtEmerson" id="txtEmerson">
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        const txtEmerson = document.getElementById("txtEmerson");
        txtEmerson.addEventListener('keyup', e => {
            fetch('http://localhost:3000/', {
                method: 'POST',
                body: txtEmerson.value
            })
            .then(resp => resp.text())
            .then(data => console.log(data));
        });
    });
    </script>
 </body>
 </html>
